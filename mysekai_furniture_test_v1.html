<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイセカイ家具図鑑</title>
<style>
:root{
  --bg:#fffafd; --ink:#292638; --muted:#9994a6; --line:#e9e3ed; --white:#fff;
  --pink:#f4a0c0; --lav:#c5b1ec; --blue:#a9cfee; --yellow:#f5df9c; --mint:#a9dfd2; --peach:#f6c4a5;
  --shadow:0 6px 20px rgba(90,70,100,.06);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit}
.top{padding:34px 20px 22px;text-align:center;background:linear-gradient(180deg,#fff 0,#fffafd 100%);border-bottom:1px solid var(--line)}
.sparkles{font-size:18px;letter-spacing:18px;color:#e7b9d1}
.logo{font-weight:800;font-size:27px;margin:10px 0 3px}.sub{font-size:12px;letter-spacing:3px;color:#aaa4b1}
main{max-width:760px;margin:auto;padding:22px 16px 110px}
.back{border:0;background:none;color:#8b75bf;font-weight:700;padding:6px 0;margin-bottom:8px}
h1{font-size:27px;margin:8px 0}.lead{color:var(--muted);line-height:1.8;margin-top:4px}
.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:24px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 7px;font-size:20px}.small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;text-align:left;cursor:pointer;min-height:92px}
.tile b{display:block;font-size:16px;margin-bottom:6px}.tile span{font-size:12px;color:var(--muted)}
.pink{background:linear-gradient(135deg,#fff5f9,#fde8f1)} .lav{background:linear-gradient(135deg,#faf7ff,#eee8fb)}
.mint{background:linear-gradient(135deg,#f7fffd,#e8f7f3)} .blue{background:linear-gradient(135deg,#f7fbff,#e9f3fb)}
.yellow{background:linear-gradient(135deg,#fffdf4,#fff7dc)} .peach{background:linear-gradient(135deg,#fffaf7,#fff0e7)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;cursor:pointer}.pill.active{font-weight:700;box-shadow:0 0 0 2px #d9caee inset}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;outline:none}.search:focus{box-shadow:0 0 0 3px #eee5fa}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid #f0ebf2}.item:last-child{border-bottom:0}
.item b{font-size:15px}.meta{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.check{min-width:74px;border:1px solid #d9d1df;background:#fff;border-radius:12px;padding:9px 10px;cursor:pointer;color:#aaa;font-weight:700}.check.on{background:#e8f8f4;border-color:#9bd9cc;color:#3eaa97}
.unit{font-size:18px;font-weight:800;margin:20px 0 10px}.charGrid{display:flex;flex-wrap:wrap;gap:8px}.char{border:1px solid var(--line);border-radius:14px;padding:10px 13px;background:#fff;cursor:pointer;color:#252232}.char.selected{outline:3px solid rgba(190,170,230,.3)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}
.nav button{border:0;background:none;color:#aaa4b1;padding:5px 2px;cursor:pointer;font-size:11px}.nav button span{display:block;font-size:21px;line-height:24px}.nav button.active{color:#df73a4;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border-radius:15px;padding:13px;text-align:center;border:1px solid var(--line)}.stat b{font-size:20px;display:block}
.notice{background:#fff7fb;border:1px dashed #edc6d8;border-radius:15px;padding:13px;color:#8d7180;font-size:12px;line-height:1.7}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="sparkles">✦　♡　✦</div>
  <div class="logo">マイセカイ家具図鑑</div>
  <div class="sub">MY SEKAI FURNITURE GUIDE</div>
</header>
<div id="app"></div>
<nav class="nav">
  <button data-page="home">HOME</button>
  <button data-page="series">♛<span>シリーズ</span></button>
  <button data-page="characters">●<span>キャラクター</span></button>
  <button data-page="status">▣<span>確認状況</span></button>
  <button data-page="list">☷<span>一覧</span></button>
</nav>
<script>
const chars={
"Leo/need":["一歌","咲希","穂波","志歩","ミク","ルカ"],
"MORE MORE JUMP！":["みのり","遥","愛莉","雫","ミク","リン"],
"Vivid BAD SQUAD":["こはね","杏","彰人","冬弥","ミク","レン","MEIKO"],
"ワンダーランズ×ショウタイム":["司","えむ","寧々","類","ミク","KAITO"],
"25時、ナイトコードで。":["奏","まふゆ","絵名","瑞希","ミク"]
};
const colors={"一歌":"#33CCBB","咲希":"#FFCC11","穂波":"#FFEE11","志歩":"#4455DD","ミク":"#B7E8DC","ルカ":"#FFBBDD","みのり":"#FFCCAA","遥":"#99CCFF","愛莉":"#FFAACC","雫":"#99EEDD","リン":"#FFDD44","こはね":"#FF6699","杏":"#00BBDD","彰人":"#FF7722","冬弥":"#0077DD","レン":"#FFE611","MEIKO":"#FF9999","司":"#FFBB00","えむ":"#FF66BB","寧々":"#33DD99","類":"#BB88EE","KAITO":"#3366CC","奏":"#BB6688","まふゆ":"#8888CC","絵名":"#CCAA88","瑞希":"#DDAACC"};
const data=[
["ナチュラルシリーズ","ナチュラルな家","家",[]],["ナチュラルシリーズ","ナチュラルな壁紙","壁",[]],["ナチュラルシリーズ","ナチュラルな床","床",[]],["ナチュラルシリーズ","ナチュラルな窓","壁掛け",[]],["ナチュラルシリーズ","ナチュラルなチェスト","棚",[]],["ナチュラルシリーズ","ナチュラルなベッド","一般 / ベッド",[]],["ナチュラルシリーズ","ナチュラルなダイニングテーブル","一般 / テーブル",[]],["ナチュラルシリーズ","ナチュラルなダイニングチェア","一般 / チェア",[]],["ナチュラルシリーズ","ナチュラルな本棚","一般 / 棚",[]],["ナチュラルシリーズ","ナチュラルなクローゼット","一般 / その他",[]],["ナチュラルシリーズ","ナチュラルなフロアライト","一般 / 家電",[]],["ナチュラルシリーズ","ナチュラルなスツール","一般 / チェア",[]],["ナチュラルシリーズ","ナチュラルなドレッサー","一般 / その他",[]],["ナチュラルシリーズ","ナチュラルなローテーブル","一般 / テーブル",[]],["ナチュラルシリーズ","ナチュラルな2人掛けソファ","一般 / チェア",[]],["ナチュラルシリーズ","ナチュラルな1人掛けソファ","一般 / チェア",[]],["ナチュラルシリーズ","ナチュラルな壁掛け時計","壁掛け",[]],["ナチュラルシリーズ","ナチュラルな液晶テレビ","一般 / 家電",[]],
["シンプルポップキッチンシリーズ","シンプルポップキッチンの壁紙","壁",[]],["シンプルポップキッチンシリーズ","シンプルポップキッチンの床","床",[]],["シンプルポップキッチンシリーズ","調理台","一般 / その他",["一歌","穂波","ルカ","遥","愛莉","雫","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","まふゆ","杏＆彰人","ミク＆MEIKO"]],["シンプルポップキッチンシリーズ","コンロ","一般 / その他",["一歌","穂波","ルカ","遥","愛莉","雫","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","まふゆ","杏＆彰人","ミク＆MEIKO"]],["シンプルポップキッチンシリーズ","シンク","一般 / その他",["穂波","ルカ","愛莉","杏","彰人","MEIKO","類","絵名"]],["シンプルポップキッチンシリーズ","冷蔵庫","一般 / 家電",["一歌","穂波","ルカ","遥","愛莉","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","奏","まふゆ","絵名"]],["シンプルポップキッチンシリーズ","キッチンウォールフック","壁掛け",[]],["シンプルポップキッチンシリーズ","キッチンツールフック","壁掛け",[]],["シンプルポップキッチンシリーズ","カッティングボード","一般 / その他",["一歌","穂波","志歩","ルカ","みのり","遥","愛莉","雫","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","奏","まふゆ","絵名","杏＆冬弥","類＆ミク"]],["シンプルポップキッチンシリーズ","調味料ラック","小物 / その他",["ルカ","みのり","雫","ミク","MEIKO"]],["シンプルポップキッチンシリーズ","積み重なった食器","小物 / その他",["一歌","穂波","志歩","みのり","遥","雫","こはね","彰人","MEIKO","えむ","奏"]],["シンプルポップキッチンシリーズ","コーヒーメーカー","小物 / 家電",["一歌","穂波","志歩","ルカ","みのり","遥","雫","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","奏","まふゆ","絵名","彰人＆冬弥"]],["シンプルポップキッチンシリーズ","ポップアップトースター","小物 / 家電",["一歌","穂波","志歩","ルカ","みのり","遥","愛莉","雫","リン","こはね","杏","彰人","冬弥","ミク","MEIKO","えむ","類","KAITO","奏","まふゆ","絵名","一歌＆ミク"]],["シンプルポップキッチンシリーズ","オーブンレンジ","小物 / 家電",["穂波","志歩","みのり","遥","愛莉","雫","リン","こはね","ミク","MEIKO","えむ","類","奏","絵名","一歌＆穂波"]],["シンプルポップキッチンシリーズ","キッチン吊戸棚","壁掛け",[]],["シンプルポップキッチンシリーズ","野菜バスケット","小物 / その他",["一歌","咲希","志歩","ミク","ルカ","みのり","遥","雫","リン","杏","彰人","冬弥","MEIKO","司","えむ","類","KAITO","奏","まふゆ","絵名"]],
["クリーンパウダールームシリーズ","クリーンパウダールームの壁紙","壁",[]],["クリーンパウダールームシリーズ","クリーンパウダールームの床","床",[]],["クリーンパウダールームシリーズ","洗面台","一般 / その他",["穂波","ルカ","遥","雫","ミク","リン","こはね","彰人","MEIKO","えむ","寧々","奏","絵名"]],["クリーンパウダールームシリーズ","洗濯機","一般 / 家電",["穂波","ルカ","愛莉","雫","ミク","リン","こはね","彰人","MEIKO","えむ","寧々","奏","絵名"]],["クリーンパウダールームシリーズ","足ふきマット","ラグ",[]],["クリーンパウダールームシリーズ","ハンディ掃除機","一般 / 家電",["穂波","ルカ","遥","愛莉","雫","ミク","リン","こはね","彰人","MEIKO","寧々","奏","絵名","遥＆リン"]],["クリーンパウダールームシリーズ","歯ブラシとコップ","小物 / その他",["愛莉","ミク","リン","こはね","彰人","えむ","奏","絵名","司＆ミク"]],["クリーンパウダールームシリーズ","ドライヤー","小物 / 家電",["穂波","ルカ","遥","愛莉","雫","ミク","リン","こはね","彰人","MEIKO","寧々","奏","絵名","志歩＆ルカ"]],["クリーンパウダールームシリーズ","クリーンパウダールームの窓","壁掛け",[]]
];

let page="home", selectedUnit=null, selectedChar=null, listFilter="すべて", categoryFilter="すべて", search="";
const key="mysekaiFurnitureChecks_v1";
let checks=JSON.parse(localStorage.getItem(key)||"{}");
function save(){localStorage.setItem(key,JSON.stringify(checks))}
function isOn(k){return !!checks[k]}
function toggle(k){checks[k]=!checks[k];save();render()}
function charKey(c,item,group){return "reaction|"+c+"|"+group+"|"+item}
function ownedKey(item){return "owned|"+item}
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function charButton(c){
  return `<button class="char" style="background:${colors[c]||"#f3eff7"}" onclick='openChar(${JSON.stringify(c)})'>${esc(c)}</button>`
}
function render(){
 const app=document.getElementById("app");
 if(page==="home") app.innerHTML=home();
 if(page==="series") app.innerHTML=series();
 if(page==="characters") app.innerHTML=characters();
 if(page==="status") app.innerHTML=status();
 if(page==="list") app.innerHTML=listPage();
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
function home(){
 const owned=Object.keys(checks).filter(k=>k.startsWith("owned|")&&checks[k]).length;
 return `<main>
 <div class="card"><div class="small">HOME</div><h1>マイセカイ家具図鑑</h1><p class="lead">家具のシリーズやキャラクターから、リアクションと所持状況を確認できる図鑑。</p></div>
 <div class="card"><h2>家具から探す</h2><p class="small">シリーズやカテゴリ、一覧から家具を探せるよ。</p>
  <div class="grid">
   <button class="tile pink" onclick="page='series';render()"><b>シリーズから探す</b><span>シリーズ → 家具</span></button>
   <button class="tile mint" onclick="page='list';render()"><b>カテゴリから探す</b><span>一般・小物・壁・床など</span></button>
   <button class="tile blue" onclick="page='list';render()"><b>家具一覧</b><span>すべての家具を検索</span></button>
 </div></div>
 <div class="card"><h2>キャラクターから探す</h2><p class="small">キャラクターを選んで、1人・複数人のリアクションを確認。</p><button class="tile lav" style="width:100%" onclick="page='characters';render()"><b>キャラクター一覧</b><span>ユニットごとに探す</span></button></div>
 <div class="card"><h2>確認状況</h2><div class="stats"><div class="stat pink"><span>所持済み</span><b>${owned}</b></div><div class="stat mint"><span>未所持</span><b>${data.length-owned}</b></div><div class="stat blue"><span>家具総数</span><b>${data.length}</b></div></div></div>
 </main>`
}
function series(){
 const groups=[...new Set(data.map(x=>x[0]))];
 return `<main><button class="back" onclick="page='home';render()">← HOME</button><div class="card"><h1>シリーズから探す</h1><p class="lead">シリーズごとに家具を見られるよ。ここでは<strong>所持状況</strong>だけをチェックできます。</p></div>
 ${groups.map((g,i)=>`<div class="card ${["pink","lav","mint","blue","yellow","peach"][i%6]}"><h2>${esc(g)}</h2><p class="small">${data.filter(x=>x[0]===g).length}件</p><button class="tile" style="width:100%" onclick='openSeries(${JSON.stringify(g)})'><b>このシリーズを見る</b><span>家具一覧・所持チェック</span></button></div>`).join("")}</main>`
}
function openSeries(g){selectedUnit=g;page="list";categoryFilter="series:"+g;render()}
function listPage(){
 let rows=data.filter(x=>categoryFilter==="すべて"||categoryFilter==="all"||x[0]===categoryFilter.replace("series:","")||x[2].split(" / ")[0]===categoryFilter);
 rows=rows.filter(x=>listFilter==="すべて"||(listFilter==="所持済み"?isOn(ownedKey(x[1])):!isOn(ownedKey(x[1]))));
 if(search) rows=rows.filter(x=>x[1].includes(search));
 const cats=["すべて","一般","小物","ラグ","壁","床","壁掛け"];
 return `<main><button class="back" onclick="page='home';render()">← HOME</button><div class="card"><h1>家具一覧</h1><p class="lead">シリーズを知らなくても、カテゴリや検索から探せるよ。</p>
 <input class="search" placeholder="家具名で検索" value="${esc(search)}" oninput="search=this.value;render()">
 <div class="pills">${cats.map(c=>`<button class="pill ${categoryFilter===c||(c==="すべて"&&categoryFilter==="all")?"active":""}" onclick='categoryFilter=${JSON.stringify(c)};render()'>${c}</button>`).join("")}</div>
 <div class="pills">${["すべて","所持済み","未所持"].map(c=>`<button class="pill ${listFilter===c?"active":""}" onclick='listFilter=${JSON.stringify(c)};render()'>${c}</button>`).join("")}</div>
 ${rows.length?rows.map(x=>itemRow(x)).join(""):`<div class="notice">条件に合う家具が見つからなかったよ。</div>`}
 </div></main>`
}
function itemRow(x){
 const on=isOn(ownedKey(x[1]));
 return `<div class="item"><div><b>${esc(x[1])}</b><span class="meta">${esc(x[2])} ・ ${esc(x[0])}</span></div><button class="check ${on?"on":""}" onclick='toggle(${JSON.stringify(ownedKey(x[1]))})'>${on?"✓ 所持":"未所持"}</button></div>`
}
function characters(){
 return `<main><button class="back" onclick="page='home';render()">← HOME</button><div class="card"><h1>キャラクターから探す</h1><p class="lead">キャラクターを選ぶと、そのキャラクターがリアクションする家具を見られるよ。</p>
 ${Object.entries(chars).map(([u,cs])=>`<section><div class="unit" style="color:${unitColor(u)}">${u}</div><div class="charGrid">${cs.map(c=>charButton(c)).join("")}</div></section>`).join("")}
 </div></main>`
}
function unitColor(u){return {"Leo/need":"#4455DD","MORE MORE JUMP！":"#DD6699","Vivid BAD SQUAD":"#EE8844","ワンダーランズ×ショウタイム":"#DD9900","25時、ナイトコードで。":"#8888CC"}[u]||"#888"}
function openChar(c){selectedChar=c;page="charDetail";render()}
function charDetail(){
 const groups=Object.entries(chars).filter(([u,cs])=>cs.includes(selectedChar)).map(x=>x[0]);
 const singles=[],multi=[];
 data.forEach(x=>x[3].forEach(r=>{if(r===selectedChar) singles.push(x); if(r.startsWith(selectedChar+"＆")||r.endsWith("＆"+selectedChar)) multi.push([x,r])}));
 const tab=window.charTab||"single";
 return `<main><button class="back" onclick="page='characters';render()">← キャラクター一覧</button><div class="card"><h1>${esc(selectedChar)}のリアクション</h1><p class="lead">1人でリアクションする家具と、複数人でリアクションする家具を分けて確認できるよ。</p>
 <div class="pills"><button class="pill ${tab==="single"?"active":""}" onclick="charTab='single';render()">1人でリアクション</button><button class="pill ${tab==="multi"?"active":""}" onclick="charTab='multi';render()">複数人でリアクション</button></div>
 ${tab==="single"?`<h2>1人でリアクションする家具 ${singles.length}件</h2>${singles.map(x=>reactionRow(x,selectedChar,"single")).join("")}`:`<h2>複数人でリアクションする家具 ${multi.length}件</h2>${multi.map(([x,r])=>reactionRow(x,r,"multi")).join("")}`}
 </div></main>`
}
function reactionRow(x,who,type){
 const k=charKey(selectedChar,x[1],who);
 const on=isOn(k);
 return `<div class="item"><div><b>${esc(x[1])}</b><span class="meta">${esc(x[2])} ・ ${esc(who)}</span></div><button class="check ${on?"on":""}" onclick='toggle(${JSON.stringify(k)})'>${on?"✓ 確認済":"未確認"}</button></div>`
}
function status(){
 const owned=data.filter(x=>isOn(ownedKey(x[1]))), reactions=Object.entries(checks).filter(([k,v])=>v&&k.startsWith("reaction|"));
 return `<main><button class="back" onclick="page='home';render()">← HOME</button><div class="card"><h1>確認状況から探す</h1><p class="lead">チェックした家具やリアクションをまとめて確認できるよ。</p>
 <div class="stats"><div class="stat pink"><span>所持済み</span><b>${owned.length}</b></div><div class="stat mint"><span>リアクション確認済み</span><b>${reactions.length}</b></div><div class="stat blue"><span>家具総数</span><b>${data.length}</b></div></div></div>
 <div class="card"><h2>所持済みの家具</h2>${owned.length?owned.map(x=>itemRow(x)).join(""):`<div class="notice">まだチェックされていないよ。</div>`}</div>
 <div class="card"><h2>最近のリアクション確認</h2>${reactions.length?reactions.map(([k])=>{let p=k.split("|");return `<div class="item"><div><b>${esc(p[3])}</b><span class="meta">${esc(p[1])} ・ ${esc(p[2])}</span></div><span class="check on">✓ 確認済</span></div>`}).join(""):`<div class="notice">まだリアクションをチェックしていないよ。</div>`}</div>
 </main>`
}
function route(){return page==="charDetail"?charDetail():null}
