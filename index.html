function seriesSelectPage(){document.getElementById("app").innerHTML=`<main class="wrap"><button class="back" onclick="home()">‹ ホームに戻る</button><div class="eyebrow">SERIES LIST</div><h2 class="page-title">シリーズから探す</h2><p class="lead">シリーズを選ぶと、そのシリーズの家具一覧へ進めるよ。</p><section class="series-list" id="seriesList"></section></main>`;const el=document.getElementById("seriesList");seriesData.forEach(s=>{const b=document.createElement("button");b.className="card series";b.style.cssText="width:100%;text-align:left";b.innerHTML=`<span class="arrow" style="float:right">›</span><h3>${s.series}</h3><p>${s.items.length}家具</p>`;b.onclick=()=>seriesPage(s.series);el.appendChild(b)})}

function renderList(){const arr=filteredFurniture(),list=document.getElementById("list");list.innerHTML="";document.getElementById("shown").textContent=arr.length;let ownedCount=0,checkedCount=0;arr.forEach(entry=>{if(state["owned:"+entry.f[0]])ownedCount++;if(entry.f[3].length&&entry.f[3].every(rx=>reactionChecked(entry.f[0],rx)))checkedCount++});document.getElementById("owned").textContent=ownedCount;document.getElementById("checked").textContent=checkedCount;if(!arr.length){list.innerHTML='<div class="empty">この条件の家具はまだないよ</div>';return}arr.forEach(o=>{const f=o.f,s=state["owned:"+f[0]],row=document.createElement("div");row.className="item";const summary=f[3].length?"リアクション："+(f[3].length>5?f[3].slice(0,5).join("・")+" …":f[3].join("・")):"リアクションなし";row.innerHTML='<div class="top"><div class="name">'+f[0]+'</div><div class="type">'+f[1]+(f[2]?" › "+f[2]:"")+'</div></div><div class="summary">'+summary+'</div><div class="checks"><label class="check" onclick="event.stopPropagation()"><input type="checkbox" '+(s?"checked":"")+'> 所持</label></div>';row.onclick=()=>openModal(o);row.querySelector("input").onchange=e=>saveOwned(f[0],e.target.checked);list.appendChild(row)})}

function renderCharacterReactions(c){const list=document.getElementById("rxList");list.innerHTML="";const solo=[],pairs=[];allFurniture().forEach(o=>o.f[3].forEach(rx=>{const parts=rx.split("＆");const hit=parts.some(x=>x===c)|| (c==="レオニミク"&&parts.includes("レオニミク")) || (c==="モモジャンミク"&&parts.includes("モモジャンミク")) || (c==="ビビバスミク"&&parts.includes("ビビバスミク")) || (c==="ワンダショミク"&&parts.includes("ワンダショミク")) || (c==="ニーゴミク"&&parts.includes("ニーゴミク"));if(!hit)return;(parts.length===1?solo:pairs).push({series:o.series,name:o.f[0],rx})}));document.getElementById("rxTotal").textContent=solo.length+pairs.length;document.getElementById("rxDone").textContent=[...solo,...pairs].filter(x=>reactionChecked(x.name,x.rx)).length;renderReactionGroup(list,"1人でリアクション",solo,false);renderReactionGroup(list,"複数人でリアクション",pairs,true);if(!solo.length&&!pairs.length)list.innerHTML='<div class="empty">このキャラクターのリアクションはまだ登録されていないよ</div>'}
function renderReactionGroup(list,title,arr,isPair){if(!arr.length)return;const h=document.createElement("div");h.className="section-label"+(isPair?" pair-label":"");h.textContent=title;list.appendChild(h);arr.forEach(x=>{const row=document.createElement("div");row.className="reaction-line";row.innerHTML='<div class="rx-name"><b>'+x.name+'</b><br><span style="color:#999">'+x.series+'</span><br><span style="color:#777">'+x.rx+'</span></div><label class="check"><input type="checkbox" '+(reactionChecked(x.name,x.rx)?"checked":"")+'> 確認済み</label>';row.querySelector("input").onchange=e=>{state["rx:"+x.name+":"+x.rx]=e.target.checked;localStorage.setItem("mysekai_checks",JSON.stringify(state));renderCharacterReactions(currentChar)};list.appendChild(row)})}
function statusPage(mode){const arr=allFurniture().filter(o=>mode==="owned"?state["owned:"+o.f[0]]:o.f[3].some(rx=>!reactionChecked(o.f[0],rx)));document.getElementById("app").innerHTML=`<main class="wrap"><button class="back" onclick="home()">‹ ホームに戻る</button><div class="eyebrow">STATUS</div><h2 class="page-title">${mode==="owned"?"所持済み家具":"リアクション未確認の家具"}</h2><p class="lead">チェックした状態を保存しているよ。</p><section class="list" id="statusList"></section></main>`;const list=document.getElementById("statusList");if(!arr.length){list.innerHTML='<div class="empty">該当する家具はないよ</div>';return}arr.forEach(o=>{const row=document.createElement("div");row.className="item";row.innerHTML='<div class="top"><div class="name">'+o.f[0]+'</div><div class="type">'+o.series+'</div></div><div class="summary">'+(o.f[3].length?"リアクションあり":"リアクションなし")+'</div>';row.onclick=()=>openModal(o);list.appendChild(row)})}
function openModal(o){const f=o.f;document.getElementById("modalName").textContent=f[0];document.getElementById("modalSeries").textContent=o.series;const p=document.getElementById("modalPeople");p.innerHTML="";if(!f[3].length){p.innerHTML='<span style="font-size:11px;color:#999">リアクションなし</span>'}else{const solo=f[3].filter(x=>!x.includes("＆")),pairs=f[3].filter(x=>x.includes("＆"));if(solo.length){const h=document.createElement("div");h.innerHTML='<div style="font-size:11px;font-weight:700;color:#7d79b2;margin-bottom:8px">1人でリアクション</div>';const d=document.createElement("div");d.className="people";solo.forEach(x=>{const s=document.createElement("span");s.className="person";s.textContent=x;d.appendChild(s)});h.appendChild(d);p.appendChild(h)}if(pairs.length){const h=document.createElement("div");h.style.marginTop="15px";h.innerHTML='<div style="font-size:11px;font-weight:700;color:#ad6680;margin-bottom:8px">複数人でリアクション</div>';const d=document.createElement("div");d.className="people";pairs.forEach(x=>{const s=document.createElement("span");s.className="pair";s.textContent=x;d.appendChild(s)});h.appendChild(d);p.appendChild(h)}}document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
home();
</script>
